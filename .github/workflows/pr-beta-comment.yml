name: PR Beta Release Comment

# Add comment to PR when beta is published
on:
  workflow_run:
    workflows: ["Beta Release"]
    types:
      - completed

permissions:
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Find PR for branch
        id: find_pr
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.workflow_run.head_branch;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });

            if (prs.length > 0) {
              return prs[0].number;
            }
            return null;

      - name: Comment on PR
        if: ${{ steps.find_pr.outputs.result != 'null' }}
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.find_pr.outputs.result }};
            const branch = context.payload.workflow_run.head_branch;
            const runUrl = context.payload.workflow_run.html_url;

            const body = [
              '## 🏷️ Beta Release Published',
              '',
              `A beta version has been published from branch \`${branch}\`.`,
              '',
              '### Test this pre-release',
              '```yaml',
              '# In your workflow, reference the beta tag:',
              `uses: sanjeevkumarraob/version-system@<beta-tag>`,
              '```',
              '',
              `[View workflow run](${runUrl})`,
              '',
              '---',
              '*This comment was automatically generated by the Beta Release workflow.*'
            ].join('\n');

            // Check for existing beta comment to update instead of duplicate
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.find(c =>
              c.body.includes('Beta Release Published') &&
              c.user.type === 'Bot'
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
            }
